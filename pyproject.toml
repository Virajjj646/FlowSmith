[project]
name = "flowsmith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viraj", email = "viraj.deglurkar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq<1",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
flowsmith = "flowsmith:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
